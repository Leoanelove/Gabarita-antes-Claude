name: Robo Diario de Editais - Gabarita PRO

on:
  workflow_dispatch:
    inputs:
      max_concursos:
        description: "Quantidade de editais para processar"
        required: true
        default: "2"
        type: string
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  executar-robo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Obter codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Executar crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.8-flash"
          MAX_CONCURSOS: ${{ inputs.max_concursos || '2' }}
        run: |
          python crawler_editais.py
