name: Robo Diario de Editais - Gabarita PRO

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          pip install requests supabase google-generativeai beautifulsoup4

      - name: Executar o script de ingestao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawler_editais.py
