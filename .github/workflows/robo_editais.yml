name: Robô Diário de Editais - Gabarita PRO

on:
  workflow_dispatch: # Permite execução manual a qualquer momento
  schedule:
    - cron: '0 6 * * *' # Executa diariamente às 03:00 (horário de Brasília)

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: |
          pip install requests supabase google-generativeai

      - name: Executar o script de ingestão
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python crawler_editais.py
